<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PharmaPro — Forgot password</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/app.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; background: var(--surface-2); padding: 24px; }
  .card { width: 360px; max-width: 100%; }
</style></head>
<body>
  <div class="card card-body">
    <h1 style="font-size:18px;margin:0 0 4px">Reset password</h1>
    <p class="sub" style="margin:0 0 14px">We email a one-time link. Same flow for cashiers who forgot the terminal password.</p>
    <div class="field"><label>Email</label><input class="input" type="email" value="bilal@demopharmacy.pk"></div>
    <button class="btn primary lg block mt-12" id="send">Send reset link</button>
    <div class="note ok mt-12" id="ok" style="font-size:11.5px;display:none">If that email exists, a reset link is on the way. Check spam. Link expires in 1 hour.</div>
    <div style="margin-top:14px;font-size:12px"><a href="login.html">← Back to sign in</a></div>
  </div>
<script>
document.getElementById('send').onclick = () => {
  document.getElementById('ok').style.display = 'block';
};
</script>
</body></html>
