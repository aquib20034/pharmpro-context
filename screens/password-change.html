<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>PharmaPro — Change password</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/app.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; background: var(--surface-2); padding: 24px; }
  .card { width: 380px; max-width: 100%; }
</style></head>
<body>
  <div class="card card-body">
    <div class="brand" style="margin-bottom:12px;padding:0;border:0;height:auto"><div class="mark"></div><div class="name">PharmaPro<small>Demo Pharmacy</small></div></div>
    <h1 style="font-size:18px;margin:0 0 4px">Change your password</h1>
    <p class="sub" style="margin:0 0 14px">Required on first login after invite, or when an Owner resets your account.</p>
    <div class="form-grid">
      <div class="field col-12"><label>Current temporary password</label><input class="input" type="password" value="Invite#temp1"></div>
      <div class="field col-12"><label>New password <span class="req">*</span></label><input class="input" type="password" id="p1"></div>
      <div class="field col-12"><label>Confirm <span class="req">*</span></label><input class="input" type="password" id="p2"></div>
    </div>
    <button class="btn primary lg block mt-12" onclick="location.href='dashboard.html'">Save &amp; continue</button>
    <div class="note warn mt-12" style="font-size:11.5px">You cannot open POS or any other screen until this is done (<span class="mono">must_change_password</span>).</div>
  </div>
</body></html>
